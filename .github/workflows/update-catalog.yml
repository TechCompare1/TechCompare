name: Update TechCompare catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Try Amazon Creators API
        env:
          AMAZON_CREATORS_API_URL: ${{ secrets.AMAZON_CREATORS_API_URL }}
          AMAZON_CREATORS_ACCESS_KEY: ${{ secrets.AMAZON_CREATORS_ACCESS_KEY }}
          AMAZON_CREATORS_SECRET_KEY: ${{ secrets.AMAZON_CREATORS_SECRET_KEY }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
        run: python3 scripts/amazon_creators_api.py

      - name: Update catalog
        run: python3 scripts/update_catalog.py

      - name: Commit catalog
        run: |
          git config user.name "TechCompare Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/amazon_prices.json
          git diff --cached --quiet || git commit -m "chore: update product catalog"
          git push
